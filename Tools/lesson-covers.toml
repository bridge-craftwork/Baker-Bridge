# What each lesson covers: the conventions, natural methods and skills its
# boards practise, as IDs from bridge-common-conventions
# (https://github.com/bridge-craftwork/bridge-common-conventions).
#
# generate_manifest.py writes these into the manifest as each lesson's
# `covers`, and check_covers.py checks every ID is defined there. A lesson
# whose own skill path is such an ID covers it; a lesson set (the
# Partnership series, the two practice sets, the two lessons that teach a
# pair of conventions) names what it draws on.
#
# First written 2026-11-16 from what bridge-common-conventions recorded about
# each lesson set, then trimmed by hand. An empty list is a lesson nobody has
# described yet. Correct these here: this file is where they are kept.

